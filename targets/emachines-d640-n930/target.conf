# eMachines D640 / AMD Phenom II N930 target facts.
# Confirmed from the physical machine's Linux SysReport unless explicitly marked.
TARGET_ID="emachines-d640-n930"
TARGET_MODEL="eMachines D640"
TARGET_VENDOR="eMachines"
TARGET_BOARD="eMachines D640 / AMD RS880M platform"
TARGET_FIRMWARE="Phoenix Technologies LTD V1.06 (2010-05-10), legacy BIOS"

TARGET_CPU="AMD Phenom II N930 Quad-Core"
TARGET_CPU_FAMILY="AMD K10 / Champlain"
TARGET_CPU_CPUID="0x00100F53"
TARGET_CPU_CORES="4"
TARGET_CPU_THREADS="4"
TARGET_CPU_FREQUENCY_GHZ="2.00"
TARGET_CPU_SUPPORTS_LONG_MODE="YES"
TARGET_CPU_SUPPORTS_SSE3="YES"
TARGET_CPU_SUPPORTS_SSSE3="NO"
TARGET_CPU_SUPPORTS_SSE4A="YES"
TARGET_CPU_SUPPORTS_SSE41="NO"
TARGET_CPU_SUPPORTS_SSE42="NO"
TARGET_CPU_SUPPORTS_AVX="NO"

# Snow Leopard must use a legacy AMD-compatible kernel. Vanilla XNU is not a
# supported target for this CPU. The first bring-up path is i386. Because K10
# lacks SSSE3, enable OpenCore LegacyCommpage for Snow Leopard userspace.
TARGET_REQUIRE_CUSTOM_KERNEL="YES"
TARGET_KERNEL_ARCH="i386"
TARGET_OPENCORE_ARCH="IA32"
TARGET_LEGACY_COMMPAGE="YES"
TARGET_PROVIDE_CURRENT_CPU_INFO="NO"

TARGET_CHIPSET="AMD RS880M + SB800"
TARGET_GPU="ATI Mobility Radeon HD 5470 / Park, 512 MB DDR3"
TARGET_GPU_PCI="1002:68E0"
TARGET_GPU_SUBSYSTEM="1025:0377"
TARGET_GPU_VBIOS_VERSION="BR35968.V06 / ATOMBIOSBK-ATI VER012.020.000.025.035968"
TARGET_GPU_VBIOS_SHA256="2d1c4738794a2616184ca1e281ac113ac8a411bdb80b658042dc78717093c170"
TARGET_GPU_CONNECTORS="LVDS-1 INTERNAL_UNIPHY sense=7; HDMI-A-1 INTERNAL_UNIPHY1 sense=2; VGA-1 INTERNAL_KLDSCP_DAC1 sense=1"
TARGET_DISPLAY="1366x768 LVDS panel; EDID was unavailable in the Linux SysReport"

TARGET_AUDIO="Realtek ALC272X codec 10EC:0272 subsystem 1025:0377 + ATI HDMI codec 1002:AA01"
TARGET_AUDIO_CONTROLLER="1002:4383 subsystem 1025:0377"
TARGET_HDMI_AUDIO_PCI="1002:AA68 subsystem 1025:0377"
TARGET_WIFI="Qualcomm Atheros AR9285 168C:002B subsystem 105B:E035"
TARGET_ETHERNET="Broadcom BCM57780 14E4:1692 subsystem 1025:033D"
TARGET_STORAGE="AMD SB7x0/SB8x0/SB9x0 AHCI 1002:4391 subsystem 1025:0377; WDC WD2500BEVT SATA-II"
TARGET_USB="AMD SB800 OHCI 1002:4397 + EHCI 1002:4396, subsystem 1025:0377"
TARGET_INPUT="i8042 PS/2 keyboard + SynPS/2 Synaptics TouchPad fw 7.4 id 0x1C0B1"
TARGET_RAM="2 GB DDR3 currently installed; second slot reported empty"

# Firmware MADT/APIC is a single table, not the duplicate-table condition seen
# on the Aspire 4310. Its firmware checksum is invalid. Linux reports the issue;
# keep the original MADT for first boot and do not apply an untested replacement.
TARGET_DROP_DUPLICATE_APIC="NO"
TARGET_APIC_OEM_ID="PTLTD"
TARGET_APIC_TABLE_LENGTH="122"
TARGET_APIC_BAD_CHECKSUM="YES"
TARGET_APIC_CHECKSUM_BYTE="0xDF"
TARGET_APIC_CORRECTED_CHECKSUM_BYTE="0xE2"

# Conservative first-boot identity. This is a software compatibility choice,
# not a statement that the hardware matches an Apple model.
TARGET_SMBIOS="MacBookPro6,2"
TARGET_ROM_ASCII="EMD640"
TARGET_UUID_SEED="emachines-d640-n930-snowleopard"
TARGET_SERIAL="W80D640N9301"
TARGET_MLB="W80D640N930100001"

# Hardware-specific graphics/Wi-Fi/audio patches remain opt-in. The VBIOS and
# connector map are now confirmed, but a historical HD 5470 framebuffer patch
# still needs to be verified against the exact 10.6.x ATI kext binary in use.
TARGET_AUTOPATCH_HD5470="NO"
TARGET_AUTOPATCH_AR9285="NO"
TARGET_AUTOPATCH_ALC272="NO"
