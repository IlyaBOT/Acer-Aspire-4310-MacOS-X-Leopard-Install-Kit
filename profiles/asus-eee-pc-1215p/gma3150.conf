# Shared OpenCore metadata for Intel GMA 3150 / Pineview on the ASUS 1215P.
# Source: Dortania Legacy Intel Setup. This is profile data only until the
# physical machine confirms PCI path, device IDs and framebuffer behavior.

GFX_PROFILE_NAME="gma3150-gma950-spoof"
GFX_PCI_PATH_EXPECTED="PciRoot(0x0)/Pci(0x2,0x0)"
GFX_NATIVE_PRIMARY_ID="8086:A011"
GFX_NATIVE_SECONDARY_ID="8086:A012"

# GMA 950 Calistoga fake device-id, little-endian Data encoding used by OpenCore.
GFX_FAKE_DEVICE_ID="A2270000"
GFX_MODEL_STRING="GMA 950"
GFX_AAPL_HAS_PANEL="01000000"
GFX_AAPL_BACKLIGHT_INTENSITY="3F000008"
GFX_AAPL_BOOT_DISPLAY="01000000"
GFX_AAPL_DATA_JUSTIFY="01000000"
GFX_AAPL_DUAL_LINK="00"

GFX_CURSOR_PATCH_COMMENT="GMA 3150 Cursor corruption fix"
GFX_CURSOR_PATCH_ENABLED="YES"
GFX_CURSOR_PATCH_IDENTIFIER="com.apple.driver.AppleIntelIntegratedFramebuffer"
GFX_CURSOR_PATCH_FIND="8b550883bab0000000017e36890424e832bbffff"
GFX_CURSOR_PATCH_REPLACE="b800000002909090909090909090eb0400000000"
GFX_CURSOR_PATCH_MIN_KERNEL="8.0.0"
GFX_CURSOR_PATCH_MAX_KERNEL="11.99.99"

# Important: the patch fixes cursor corruption only. Dortania explicitly notes
# that GMA3150 can be spoofed into this stack but proper acceleration is missing.
GFX_EXPECTED_SUPPORT="PARTIAL"
GFX_FORCE_32BIT_KERNELSPACE="YES"
