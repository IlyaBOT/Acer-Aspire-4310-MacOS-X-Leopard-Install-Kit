PROFILE_NAME=snowleopard
PROFILE_STATUS=planned
OS_NAME="Mac OS X Snow Leopard"
OS_RANGE=10.6.x
OS_BASELINE=10.6.3
OS_FINAL=10.6.8
DARWIN_RANGE=10.x
INSTALL_METHOD=retail-media

# Hardware audit is complete. The profile remains 'planned' only because the
# ASUS-specific media/config implementation engine is not yet wired into the dispatcher.
HARDWARE_AUDIT_STATUS=complete
CUSTOM_KERNEL_REQUIRED=YES
CUSTOM_KERNEL_FAMILY="Atom/Pineview"
KERNEL_ARCH=i386
DEFAULT_KERNEL_ARCH=i386
KERNEL_CACHE=Auto

# Legacy GMA generation and Lion compatibility make MacBook2,1 the starting SMBIOS.
SMBIOS=MacBook2,1
GRAPHICS_PROFILE="profiles/asus-eee-pc-1215p/gma3150.conf"

FIRST_BOOT_VERSION=10.6.3
FIRST_BOOT_GOAL="Reach retail installer and desktop using Atom kernel, native Intel 27C1 AHCI, PS/2 input and audited GMA3150 framebuffer settings"
FIRST_BOOT_MINIMAL_KEXT_SET="FakeSMC + legacy PS/2 only; add storage injector only if native 27C1 AHCI fails"
FIRST_BOOT_ETHERNET="AR8152 v2 1969:2062 confirmed; stage AtherosL1cEthernet after base boot"
FIRST_BOOT_WIFI="AR9285 168C:002B confirmed; keep optional until base 10.6.3 is stable, then validate period-correct IO80211/Atheros path"
FIRST_BOOT_AUDIO="ALC269VB 10EC:0269 confirmed; VoodooHDA optional after base boot"
FIRST_BOOT_BATTERY="ACPI BAT0 confirmed; legacy battery kext optional after base boot"
FIRST_BOOT_WEBCAM="USB UVC 13D3:5711; test class-driver behavior after base boot"

ACPI_PCI_ROOT_UID_PATCH_REQUIRED=NO
ACPI_NOTES="Physical DSDT has PCI0._UID=Zero, VGA at \\_SB.PCI0.VGA, EC0 under SBRG, PS2K/PS2M, BAT0/LID and legacy ATKD ASUS010. Do not use another Eee PC's DSDT."

NOTES="Physical Linux audit complete. Historical ASUS 1215P evidence confirms 10.6.3 bring-up with Atom kernel/AHCI/PS2. Do not jump to 10.6.8 until a matching Atom kernel/update procedure is staged. Next repository task is an ASUS-specific OpenCore Legacy IA32 media engine using this audited hardware profile."
