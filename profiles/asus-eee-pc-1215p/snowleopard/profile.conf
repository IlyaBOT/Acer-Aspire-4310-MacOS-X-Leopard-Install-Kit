PROFILE_NAME=snowleopard
PROFILE_STATUS=experimental
OS_NAME="Mac OS X Snow Leopard"
OS_RANGE=10.6.x
OS_BASELINE=10.6.3
OS_FINAL=10.6.8
DARWIN_RANGE=10.x
INSTALL_METHOD=retail-media
IMPLEMENTATION_ENGINE="scripts/prepare_asus_1215p_snowleopard.sh"

HARDWARE_AUDIT_STATUS=complete
CUSTOM_KERNEL_REQUIRED=YES
CUSTOM_KERNEL_FAMILY="Atom/Pineview"
KERNEL_ARCH=i386
DEFAULT_KERNEL_ARCH=i386
KERNEL_CACHE=Auto

# Legacy GMA generation and Lion compatibility make MacBook2,1 the starting SMBIOS.
SMBIOS=MacBook2,1
GRAPHICS_PROFILE="profiles/asus-eee-pc-1215p/gma3150.conf"

FIRST_BOOT_VERSION=10.6.3
FIRST_BOOT_GOAL="Physical 10.6.3 retail Installer GUI/userland reached on the genuine Atom N570; next validate the clean RELEASE kernel, installed desktop and remaining devices"
FIRST_BOOT_MINIMAL_KEXT_SET="Physically validated baseline: FakeSMC + legacy PS/2 with native Intel 27C1 AHCI; no storage injector required"
FIRST_BOOT_ETHERNET="AR8152 v2 1969:2062 confirmed; period-correct AtherosL1cEthernet candidate staged for the next physical test"
FIRST_BOOT_WIFI="AR9285 168C:002B confirmed; experimental AirPortAtheros21 matching path staged for physical validation on 10.6.3"
FIRST_BOOT_AUDIO="ALC269VB 10EC:0269 confirmed; VoodooHDA candidate staged for the next physical test"
FIRST_BOOT_BATTERY="ACPI BAT0/EC0/AC0 exposed; legacy VoodooBattery candidate staged for the next physical test"
FIRST_BOOT_WEBCAM="USB UVC 13D3:5711 physically visible and working in the 10.6.3 Installer USB tree"

ACPI_PCI_ROOT_UID_PATCH_REQUIRED=NO
ACPI_NOTES="Physical DSDT has PCI0._UID=Zero, VGA at \\_SB.PCI0.VGA, EC0 under SBRG, PS2K/PS2M, BAT0/LID and legacy ATKD ASUS010. Do not use another Eee PC's DSDT."

NOTES="Physical 10.6.3 Installer GUI/userland boot is validated on the real Atom N570 with the source-built Darwin 10.3.0 i386 path. Status remains experimental until the clean RELEASE kernel, installed desktop and remaining peripheral drivers are physically validated. Do not update to 10.6.8 until a matching Atom kernel/update procedure is staged and tested."
