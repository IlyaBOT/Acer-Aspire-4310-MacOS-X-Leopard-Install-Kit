PROFILE_NAME=snowleopard
PROFILE_STATUS=planned
OS_NAME="Mac OS X Snow Leopard"
OS_RANGE=10.6.x
OS_BASELINE=10.6.3
OS_FINAL=10.6.8
DARWIN_RANGE=10.x
INSTALL_METHOD=retail-media

# Apple dropped Atom support after early Snow Leopard; first boot therefore
# requires an Atom-capable/custom kernel rather than a vanilla 10.6.3 kernel.
CUSTOM_KERNEL_REQUIRED=YES
CUSTOM_KERNEL_FAMILY="Atom/Pineview"
KERNEL_ARCH=i386
DEFAULT_KERNEL_ARCH=i386
KERNEL_CACHE=Auto

# MacBook2,1 is a useful legacy laptop SMBIOS match: GMA950 generation and Lion-capable.
SMBIOS=MacBook2,1
GRAPHICS_PROFILE="profiles/asus-eee-pc-1215p/gma3150.conf"

FIRST_BOOT_VERSION=10.6.3
FIRST_BOOT_GOAL="Reach installer and desktop with AHCI, Atom kernel, PS/2 input and GMA3150 framebuffer path; validate hardware before enabling optional devices"
FIRST_BOOT_WIFI="DISABLED_UNTIL_AUDIT"
FIRST_BOOT_AUDIO="OPTIONAL_VOODOOHDA_AFTER_BASE_BOOT"
FIRST_BOOT_ETHERNET="AtherosL1cEthernet candidate only if physical NIC is 1969:2062"

NOTES="Pre-audit profile. Historical ASUS 1215P reports confirm Snow Leopard 10.6.3 can boot with an Atom kernel/AHCI/PS2 stack; physical Linux SysReport is required before the implementation engine and destructive media build are enabled. Do not update to 10.6.8 until the Atom kernel/update path is staged and tested."
