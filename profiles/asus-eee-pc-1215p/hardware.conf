# ASUS Eee PC 1215P target facts and pre-audit expectations.
# Public sources show multiple factory component variants. Values marked EXPECTED
# must be replaced/confirmed from the physical machine's Linux SysReport before
# enabling destructive build/install operations.

TARGET_MODEL="ASUS Eee PC 1215P"
TARGET_PLATFORM="Intel Pine Trail / NM10"
TARGET_CPU="Intel Atom N570"
TARGET_CPU_CORES="2"
TARGET_CPU_THREADS="4"
TARGET_CPU_FREQUENCY_GHZ="1.66"
TARGET_CPU_FSB_MHZ="667"
TARGET_CPU_L2_KB="1024 total (2 x 512 KB)"
TARGET_CPU_SUPPORTS_LONG_MODE="YES"
TARGET_CPU_SUPPORTS_SSE3="YES"
TARGET_CPU_SUPPORTS_SSSE3="YES"
TARGET_CPU_SUPPORTS_VMX="YES"
# Pineview/Bonnell: family 6, model 28 (0x1C), stepping 10 (0xA).
TARGET_CPU_CPUID_EXPECTED="0x000106CA"

# Keep kernelspace i386 for legacy Intel GMA drivers even though the N570 is x86-64 capable.
TARGET_OPENCORE_ARCH="IA32"
TARGET_KERNEL_ARCH="i386"

TARGET_CHIPSET="Intel N10/NM10 + ICH7 family"
TARGET_HOST_BRIDGE_EXPECTED="8086:A010 Intel N10 Family DMI Bridge"
TARGET_SATA_EXPECTED="8086:27C1 Intel ICH7/NM10 AHCI"
TARGET_SMBUS_EXPECTED="8086:27DA Intel ICH7/NM10 SMBus"
TARGET_USB_EXPECTED="8086:27C8/27C9/27CB UHCI + 8086:27CC EHCI"

TARGET_GPU="Intel GMA 3150 / Pineview"
TARGET_GPU_PRIMARY_EXPECTED="8086:A011 VGA"
TARGET_GPU_SECONDARY_EXPECTED="8086:A012 display function"
TARGET_GPU_MACOS_STRATEGY="GMA950 spoof + legacy AppleIntelGMA950/AppleIntelIntegratedFramebuffer + cursor patch"
TARGET_GPU_ACCELERATION_EXPECTATION="PARTIAL; proper GMA3150 acceleration is not guaranteed"

TARGET_DISPLAY="12.1-inch LED 1366x768"
TARGET_PANEL_VARIANT_OBSERVED="HannStar HSD121PHW1 / HSD04B6 reported on a real 1215P; verify EDID"
TARGET_DUALLINK="NO"

# User unit: 2 GB DDR2. Public 1215P reports include both DDR2 and DDR3 configurations.
TARGET_RAM="2 GB (physical unit reported as DDR2; verify SPD)"
TARGET_RAM_PUBLIC_VARIANTS="DDR2-667 and DDR3 variants exist; 2 GB is a common/official maximum for this platform"
TARGET_STORAGE="2.5-inch SATA; physical unit upgraded to SATA SSD"
TARGET_OPTICAL="none"

TARGET_AUDIO_EXPECTED="Intel HDA 8086:27D8 + Realtek ALC269 (10EC:0269), ASUS subsystem commonly 1043:841C"
TARGET_ETHERNET_EXPECTED="Atheros/Attansic AR8152 v2 Fast Ethernet 1969:2062, ASUS subsystem commonly 1043:8468"
TARGET_WIFI_VARIANTS="Broadcom BCM4313 14E4:4727; Atheros AR9285 168C:002B; Ralink variants were also shipped"
TARGET_BLUETOOTH="optional; verify USB ID on physical unit"
TARGET_TOUCHPAD_VARIANTS="Synaptics SYN0A13 reported on real units; ASUS also distributed Elantech touchpad drivers"
TARGET_KEYBOARD="PS/2-compatible keyboard expected"
TARGET_WEBCAM_EXPECTED="USB UVC; 13D3:5702 observed on 1215P"
TARGET_CARD_READER="integrated SD/SDHC/SDXC/MMC; controller ID unknown until physical audit"

TARGET_FIRMWARE="American Megatrends legacy BIOS; 0601 is latest ASUS release found (2011-05-11)"
TARGET_BIOS_AHCI_REQUIRED="YES"
TARGET_BIOS_LATEST_KNOWN="0601"
TARGET_ACPI_NOTES="Eee PC firmware exposes ASUS WMI/legacy ATKD behavior; Linux reports hotkey/backlight differences depending on _OSI. Dump DSDT/SSDT before macOS ACPI patches."

TARGET_AUDIT_STATUS="PENDING_PHYSICAL_LINUX_SYSREPORT"
