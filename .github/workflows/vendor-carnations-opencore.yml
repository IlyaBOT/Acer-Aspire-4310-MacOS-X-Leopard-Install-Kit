name: Vendor Carnations OpenCore 1.0.5 DEBUG

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/vendor-carnations-opencore.yml'
      - 'scripts/build_carnations_opencore.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build pinned Carnations OpenCore
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f vendor/carnations-opencore/OpenCore-1.0.5-DEBUG.zip
          rm -rf cache/carnations-opencore
          bash scripts/build_carnations_opencore.sh --ensure
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import zipfile

          commit = "4d0803b5c1dbb12378e35712b213e531adde1d88"
          root = Path("cache/carnations-opencore") / f"src-{commit}" / "Binaries"
          required = {
              "X64/EFI/OC/OpenCore.efi",
              "X64/EFI/BOOT/BOOTx64.efi",
              "X64/EFI/OC/Drivers/OpenRuntime.efi",
              "X64/EFI/OC/Drivers/OpenHfsPlus.efi",
              "X64/EFI/OC/Drivers/OpenPartitionDxe.efi",
              "Docs/Sample.plist",
              "Utilities/macrecovery/macrecovery.py",
          }
          candidates = []
          for p in root.glob("*.zip"):
              try:
                  with zipfile.ZipFile(p) as zf:
                      names = set(zf.namelist())
              except zipfile.BadZipFile:
                  continue
              if required <= names:
                  score = 2 if "DEBUG" in p.name.upper() else 1
                  candidates.append((score, p.name, p))
          if not candidates:
              raise SystemExit(f"No usable OpenCore archive under {root}")
          candidates.sort()
          src = candidates[-1][2]
          marker = b"Original mach_kernel is absent, trying ESP Kernels fallback"
          with zipfile.ZipFile(src) as zf:
              opencore = zf.read("X64/EFI/OC/OpenCore.efi")
          if marker not in opencore:
              raise SystemExit(f"Built archive is missing Mavericks ESP mach_kernel fallback marker: {src}")

          dest = Path("vendor/carnations-opencore/OpenCore-1.0.5-DEBUG.zip")
          dest.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(src, dest)
          print(f"Vendored verified patched archive {src} -> {dest}")
          PY
          sha256sum vendor/carnations-opencore/OpenCore-1.0.5-DEBUG.zip             | tee vendor/carnations-opencore/OpenCore-1.0.5-DEBUG.zip.sha256

      - name: Commit vendored archive
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f             vendor/carnations-opencore/OpenCore-1.0.5-DEBUG.zip             vendor/carnations-opencore/OpenCore-1.0.5-DEBUG.zip.sha256
          if git diff --cached --quiet; then
            echo "Vendored archive unchanged"
          else
            git commit -m "Vendor patched Carnations OpenCore 1.0.5 DEBUG"
            git push origin HEAD:main
          fi
