name: Legacy laptop profile check

on:
  push:
    branches:
      - main
    paths:
      - 'legacy_macos_install.sh'
      - 'prepare_aspire4310_macos.sh'
      - 'profiles/**'
      - 'targets/**'
      - 'docs/**'
      - 'scripts/collect_linux_hardware_v2.sh'
      - 'scripts/generic_pc_profile.py'
      - 'scripts/generate_target_oc_config.py'
      - 'scripts/download_a8_mavericks_assets.sh'
      - 'scripts/download_carnations_amd_kernel.sh'
      - 'scripts/build_carnations_opencore.sh'
      - 'scripts/linux_make_recovery_usb.sh'
      - 'scripts/apply_mavericks_amd_kernel.sh'
      - 'scripts/prepare_asrock_a8_mavericks.sh'
      - 'scripts/prepare_emachines_d640_snowleopard.sh'
      - 'scripts/linux_make_usb.sh'
      - 'scripts/linux_install_openduet.sh'
      - 'scripts/d640_usb_boot_probe.sh'
      - 'scripts/select_opencore_release.sh'
      - 'scripts/prepare_asus_1215p_snowleopard.sh'
      - 'scripts/patch_asus_1215p_oc_config.py'
      - 'scripts/fetch_atom_1063_kernel.sh'
      - '.github/workflows/legacy-profile-check.yml'
  pull_request:
    paths:
      - 'legacy_macos_install.sh'
      - 'prepare_aspire4310_macos.sh'
      - 'profiles/**'
      - 'targets/**'
      - 'docs/**'
      - 'scripts/collect_linux_hardware_v2.sh'
      - 'scripts/generic_pc_profile.py'
      - 'scripts/generate_target_oc_config.py'
      - 'scripts/download_a8_mavericks_assets.sh'
      - 'scripts/download_carnations_amd_kernel.sh'
      - 'scripts/build_carnations_opencore.sh'
      - 'scripts/linux_make_recovery_usb.sh'
      - 'scripts/apply_mavericks_amd_kernel.sh'
      - 'scripts/prepare_asrock_a8_mavericks.sh'
      - 'scripts/prepare_emachines_d640_snowleopard.sh'
      - 'scripts/linux_make_usb.sh'
      - 'scripts/linux_install_openduet.sh'
      - 'scripts/d640_usb_boot_probe.sh'
      - 'scripts/select_opencore_release.sh'
      - 'scripts/prepare_asus_1215p_snowleopard.sh'
      - 'scripts/patch_asus_1215p_oc_config.py'
      - 'scripts/fetch_atom_1063_kernel.sh'
      - '.github/workflows/legacy-profile-check.yml'
  workflow_dispatch:

jobs:
  profiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell/Python syntax and compatibility links
        run: |
          bash -n legacy_macos_install.sh
          bash -n prepare_aspire4310_macos.sh
          bash -n scripts/collect_linux_hardware_v2.sh
          python3 -m py_compile scripts/generic_pc_profile.py
          python3 -m py_compile scripts/generate_target_oc_config.py
          bash -n scripts/download_a8_mavericks_assets.sh
          bash -n scripts/download_carnations_amd_kernel.sh
          bash -n scripts/build_carnations_opencore.sh
          bash -n scripts/linux_make_recovery_usb.sh
          bash -n scripts/apply_mavericks_amd_kernel.sh
          bash -n scripts/prepare_asrock_a8_mavericks.sh
          bash -n scripts/prepare_emachines_d640_snowleopard.sh
          bash -n scripts/linux_make_usb.sh
          bash -n scripts/linux_install_openduet.sh
          bash -n scripts/d640_usb_boot_probe.sh
          bash -n scripts/select_opencore_release.sh
          bash -n scripts/prepare_asus_1215p_snowleopard.sh
          bash -n scripts/fetch_atom_1063_kernel.sh
          python3 -m py_compile scripts/patch_asus_1215p_oc_config.py
          test -L config/aspire4310.conf
          test -L profiles/leopard
          test -L profiles/snowleopard
          test -L targets/emachines-d640-n930
          test -f profiles/acer-aspire-4310/leopard/profile.conf
          test -f profiles/acer-aspire-4310/snowleopard/profile.conf
          test -f profiles/acer-aspire-4310/lion/profile.conf
          test -f profiles/emachines-d640-n930/snowleopard/profile.conf
          test -f profiles/emachines-d640-n930/lion/profile.conf
          test -f profiles/emachines-d640-n930/mountainlion/profile.conf
          test -f profiles/emachines-d640-n930/mavericks/profile.conf
          test -f docs/AMD_SNOW_LEOPARD_KERNELS.md
          test -f docs/EMACHINES_D640_HARDWARE_SNAPSHOT.md
          test -f docs/EMACHINES_D640_LINUX.md
          test -f profiles/asus-eee-pc-1215p/README.md
          test -f profiles/asus-eee-pc-1215p/AUDIT.md
          test -f profiles/asus-eee-pc-1215p/hardware.conf
          test -f profiles/asus-eee-pc-1215p/gma3150.conf
          test -f profiles/asus-eee-pc-1215p/snowleopard/profile.conf
          test -f profiles/asus-eee-pc-1215p/snowleopard/kexts.conf
          test -f profiles/asus-eee-pc-1215p/lion/profile.conf
          test -f profiles/asrock-fm2a58m-vg3-a8-7600/hardware.conf
          test -f profiles/asrock-fm2a58m-vg3-a8-7600/mavericks/profile.conf
          test -f profiles/asrock-fm2a58m-vg3-a8-7600/mavericks/kexts.conf

      - name: Exercise human-facing dispatcher
        run: |
          ./legacy_macos_install.sh --list-targets
          ./legacy_macos_install.sh --list-profiles
          ./legacy_macos_install.sh --help | grep -q -- '--opencore-version'
          ./legacy_macos_install.sh --help | grep -q -- '--profile new'
          ./legacy_macos_install.sh --profile universal --doctor
          ./legacy_macos_install.sh --profile new --os mavericks --doctor --name 'CI Generic PC' --non-interactive --profiles-dir "$RUNNER_TEMP/generated-profiles"
          test -f "$RUNNER_TEMP/generated-profiles/ci-generic-pc/hardware.conf"
          grep -q '^PROFILE_ANALYSIS_ONLY=YES$' "$RUNNER_TEMP/generated-profiles/ci-generic-pc/hardware.conf"
          grep -q '^TARGET_ARCH=AMD64$' "$RUNNER_TEMP/generated-profiles/ci-generic-pc/hardware.conf"
          ./legacy_macos_install.sh --target acer-aspire-4310 --os lion --doctor
          ./legacy_macos_install.sh --target emachines-d640-n930 --os snowleopard --help
          ./legacy_macos_install.sh --target emachines-d640-n930 --os lion --doctor
          ./legacy_macos_install.sh --target asus-eee-pc-1215p --os snowleopard --help
          ./legacy_macos_install.sh --target asus-eee-pc-1215p --os lion --doctor
          ./legacy_macos_install.sh --target asrock-fm2a58m-vg3-a8-7600 --os mavericks --doctor
          ./legacy_macos_install.sh --target emachines-d640-n930 --usb-probe --list

      - name: Validate Carnations AMD mach_kernel selector
        run: |
          grep -q 'snowleopard).*32e2a01c88a46a15f33b4cd69f88251cc0a6961a' scripts/download_carnations_amd_kernel.sh ||             grep -q '32e2a01c88a46a15f33b4cd69f88251cc0a6961a' scripts/download_carnations_amd_kernel.sh
          grep -q 'b9278deff8281dbd45f848d881c0f33071198d14' scripts/download_carnations_amd_kernel.sh
          grep -q '68cc1f3cae39ae0e85abb00b9ab6c0c81d5b4d28' scripts/download_carnations_amd_kernel.sh
          grep -q 'cfdf0513edd8c57ed7f9b7c2d1f90090425b00fd' scripts/download_carnations_amd_kernel.sh
          grep -q -- '--os mavericks --output "$AMD_ROOT/mach_kernel"' scripts/download_a8_mavericks_assets.sh
          bash scripts/download_carnations_amd_kernel.sh --help | grep -q 'snowleopard | lion | mountainlion | mavericks'

      - name: Validate A8-7600 Mavericks AMD profile and patch specialization
        run: |
          grep -q '^PROFILE_STATUS=experimental$' profiles/asrock-fm2a58m-vg3-a8-7600/mavericks/profile.conf
          grep -q '^TARGET_CPU_CORES="4"$' profiles/asrock-fm2a58m-vg3-a8-7600/hardware.conf
          grep -q '^TARGET_OPENCORE_ARCH="X64"$' profiles/asrock-fm2a58m-vg3-a8-7600/hardware.conf
          grep -q '^TARGET_GPU_INTEGRATED_BDF="00:01.0"$' profiles/asrock-fm2a58m-vg3-a8-7600/hardware.conf
          grep -q '^TARGET_GPU_INTEGRATED_OC_PATH="PciRoot(0x0)/Pci(0x1,0x0)"$' profiles/asrock-fm2a58m-vg3-a8-7600/hardware.conf
          grep -q '^TARGET_GPU_INTEGRATED_BLACKLIST="YES"$' profiles/asrock-fm2a58m-vg3-a8-7600/hardware.conf
          grep -q 'VoodooTSCSync.kext' profiles/asrock-fm2a58m-vg3-a8-7600/mavericks/kexts.conf
          grep -q 'RealtekRTL8111.kext' profiles/asrock-fm2a58m-vg3-a8-7600/mavericks/kexts.conf
          grep -q -- '--runtime-profile legacy' scripts/prepare_asrock_a8_mavericks.sh
          grep -q -- '--setup-virtual-map' scripts/prepare_asrock_a8_mavericks.sh
          grep -q -- '--force-exit-boot-services' scripts/prepare_asrock_a8_mavericks.sh
          grep -q -- '--custom-kernel' scripts/prepare_asrock_a8_mavericks.sh
          grep -q -- '--no-release-usb-ownership' scripts/prepare_asrock_a8_mavericks.sh
          grep -q 'ReleaseUsbOwnership.*is False' scripts/prepare_asrock_a8_mavericks.sh
          grep -q 'EnableWriteUnprotector.*is True' scripts/prepare_asrock_a8_mavericks.sh
          grep -q 'RebuildAppleMemoryMap.*is False' scripts/prepare_asrock_a8_mavericks.sh
          grep -q 'SyncRuntimePermissions.*is False' scripts/prepare_asrock_a8_mavericks.sh
          grep -q 'SetupVirtualMap.*is True' scripts/prepare_asrock_a8_mavericks.sh
          grep -q 'ForceExitBootServices.*is True' scripts/prepare_asrock_a8_mavericks.sh
          grep -q -- '--driver OpenHfsPlus.efi' scripts/prepare_asrock_a8_mavericks.sh
          grep -q -- '--driver OpenPartitionDxe.efi' scripts/prepare_asrock_a8_mavericks.sh
          grep -q 'LOCAL_PATCH_REV="3"' scripts/build_carnations_opencore.sh
          grep -q 'Original mach_kernel is absent, trying ESP Kernels fallback' scripts/build_carnations_opencore.sh
          grep -q 'ESP kernelcache missing under Cacheless; trying mach_kernel instead' scripts/build_carnations_opencore.sh
          grep -q 'ESP mach_kernel-for-kernelcache fallback status' scripts/build_carnations_opencore.sh
          grep -q 'ESP/Kernels/mach_kernel' scripts/prepare_asrock_a8_mavericks.sh
          python3 - <<'PY'
          from pathlib import Path
          s = Path("scripts/prepare_asrock_a8_mavericks.sh").read_text()
          stage = s.index('cp -f "$CACHE_ROOT/amd/mach_kernel" "$BUILD_ROOT/ESP/Kernels/mach_kernel"')
          validate = s.index('python3 "$VALIDATOR" "$BUILD_ROOT/ESP/EFI/OC/config.plist"')
          assert stage < validate, "Custom kernel must be staged before OpenCore tree validation"
          print("A8 CustomKernel validation order: PASS")
          PY
          grep -q 'OpenPartitionDxe.efi' scripts/linux_make_recovery_usb.sh
          grep -q 'MAVERICKS_BOARD_ID="Mac-F60DEB81FF30ACF6"' scripts/linux_make_recovery_usb.sh
          grep -q 'MAVERICKS_MLB="00000000000FNN100"' scripts/linux_make_recovery_usb.sh
          grep -q -- '-n RecoveryImage' scripts/linux_make_recovery_usb.sh
          bash scripts/linux_make_recovery_usb.sh --help | grep -q 'UEFI OpenCore Mavericks Recovery USB'
          python3 - <<'PY'
          import importlib.util
          import pathlib
          import plistlib
          import tempfile

          spec = importlib.util.spec_from_file_location(
              "generator", "scripts/generate_target_oc_config.py"
          )
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          patch = {
              "Kernel": {
                  "Patch": [
                      {
                          "Arch": "x86_64",
                          "Base": "_cpuid_set_info",
                          "Comment": "_cpuid_set_info | Force cpuid_cores_per_package",
                          "Count": 1,
                          "Enabled": True,
                          "Find": bytes.fromhex("c1ea1affc2"),
                          "Identifier": "kernel",
                          "Limit": 0,
                          "Mask": b"",
                          "MaxKernel": "13.99.99",
                          "MinKernel": "13.0.0",
                          "Replace": bytes.fromhex("ba00000000"),
                          "ReplaceMask": b"",
                          "Skip": 0,
                      }
                  ]
              }
          }
          with tempfile.TemporaryDirectory() as td:
              p = pathlib.Path(td) / "patch.plist"
              with p.open("wb") as f:
                  plistlib.dump(patch, f)
              patches = mod.load_kernel_patches(p, 4)
              assert patches[0]["Replace"] == bytes.fromhex("ba04000000")
          assert mod.KERNEL_RANGES["mavericks"] == ("13.0.0", "13.99.99")
          poison = mod.gpu_blacklist_properties()
          assert poison["name"] == "unused"
          assert poison["IOName"] == "#display"
          assert poison["class-code"] == bytes.fromhex("ffffffff")
          assert poison["vendor-id"] == bytes.fromhex("ffff0000")
          assert poison["device-id"] == bytes.fromhex("ffff0000")
          print("A8 Mavericks patch specialization + GPU blacklist: PASS")
          PY

      - name: Validate D640 Linux merge and blocked hardware status
        run: |
          grep -q '^PROFILE_STATUS=experimental$' profiles/emachines-d640-n930/snowleopard/profile.conf
          grep -q '^HARDWARE_TEST_STATUS=blocked$' profiles/emachines-d640-n930/snowleopard/profile.conf
          grep -q '^HARDWARE_TEST_RESULT="no-known-good-boot"$' profiles/emachines-d640-n930/snowleopard/profile.conf
          grep -q 'Linux USB-writing backend' README.md
          grep -q 'Current physical-target status.*blocked' docs/EMACHINES_D640_LINUX.md
          grep -q '^preflight_asm()' scripts/d640_usb_boot_probe.sh
          grep -q '^preflight_asm$' scripts/d640_usb_boot_probe.sh
          grep -Fq 'times 446-(\$-\$\$) db 0' scripts/d640_usb_boot_probe.sh
          grep -q 'Linux legacy macOS USB backend' scripts/linux_make_usb.sh

      - name: Unit-test cached OpenCore selector without network
        run: |
          mkdir -p cache/opencore/0.0.0/DEBUG/Docs \
                   cache/opencore/0.0.0/DEBUG/IA32/EFI/OC \
                   cache/opencore/0.0.0/DEBUG/IA32/EFI/BOOT \
                   cache/opencore/0.0.0/DEBUG/Utilities/LegacyBoot
          : > cache/opencore/0.0.0/DEBUG/Docs/Sample.plist
          : > cache/opencore/0.0.0/DEBUG/IA32/EFI/OC/OpenCore.efi
          : > cache/opencore/0.0.0/DEBUG/IA32/EFI/BOOT/BOOTIA32.efi
          : > cache/opencore/0.0.0/DEBUG/Utilities/LegacyBoot/bootIA32
          : > cache/opencore/0.0.0/DEBUG/Utilities/LegacyBoot/boot0
          : > cache/opencore/0.0.0/DEBUG/Utilities/LegacyBoot/boot1f32
          cat > cache/current-sources.env <<'EOF'
          OC_VERSION=old
          OC_VARIANT=DEBUG
          OC_CACHE_REL=opencore/old/DEBUG
          HFS_32_FILE=keep-this-value
          LEGACY_KEXTS_CACHE_REL=keep-this-too
          EOF
          bash scripts/select_opencore_release.sh --select-only --version 0.0.0 --variant debug
          grep -q '^OC_VERSION=0.0.0$' cache/current-sources.env
          grep -q '^OC_VARIANT=DEBUG$' cache/current-sources.env
          grep -q '^OC_CACHE_REL=opencore/0.0.0/DEBUG$' cache/current-sources.env
          grep -q '^HFS_32_FILE=keep-this-value$' cache/current-sources.env
          grep -q '^LEGACY_KEXTS_CACHE_REL=keep-this-too$' cache/current-sources.env

      - name: Validate audited ASUS 1215P metadata
        run: |
          grep -q 'PROFILE_STATUS=experimental' profiles/asus-eee-pc-1215p/snowleopard/profile.conf
          grep -q 'CUSTOM_KERNEL_REQUIRED=YES' profiles/asus-eee-pc-1215p/snowleopard/profile.conf
          grep -q 'KERNEL_ARCH=i386' profiles/asus-eee-pc-1215p/snowleopard/profile.conf
          grep -q 'TARGET_ETHERNET="Qualcomm Atheros AR8152 v2 1969:2062' profiles/asus-eee-pc-1215p/hardware.conf
          grep -q 'TARGET_WIFI="Qualcomm Atheros AR9285 168C:002B' profiles/asus-eee-pc-1215p/hardware.conf
          grep -q 'TARGET_AUDIO="Intel HDA 8086:27D8 subsystem 1043:841C + Realtek ALC269VB 10EC:0269"' profiles/asus-eee-pc-1215p/hardware.conf
          grep -q 'TARGET_ACPI_PCI_ROOT_UID="0"' profiles/asus-eee-pc-1215p/hardware.conf
          grep -q 'GFX_NATIVE_PRIMARY_ID="8086:A011"' profiles/asus-eee-pc-1215p/gma3150.conf
          grep -q 'GFX_CURSOR_PATCH_IDENTIFIER="com.apple.driver.AppleIntelIntegratedFramebuffer"' profiles/asus-eee-pc-1215p/gma3150.conf
          grep -q 'GFX_CURSOR_PATCH_MAX_KERNEL="11.99.99"' profiles/asus-eee-pc-1215p/gma3150.conf

      - name: Unit-test ASUS GMA3150 config postprocessor
        run: |
          python3 - <<'PY'
          import plistlib, pathlib, subprocess, tempfile
          config = {
              'DeviceProperties': {'Add': {}, 'Delete': {}},
              'Kernel': {'Patch': [], 'Scheme': {'KernelArch':'i386','CustomKernel':True,'FuzzyMatch':True}},
              'NVRAM': {'Add': {'7C436110-AB2A-4BBB-A880-FE41995C9F82': {'boot-args':'-v'}}},
              'PlatformInfo': {'Generic': {}},
              'UEFI': {'Drivers': []},
          }
          with tempfile.TemporaryDirectory() as td:
              p = pathlib.Path(td) / 'config.plist'
              with p.open('wb') as f: plistlib.dump(config, f)
              for _ in range(2):
                  subprocess.run(['python3','scripts/patch_asus_1215p_oc_config.py',str(p)], check=True)
              subprocess.run(['python3','scripts/patch_asus_1215p_oc_config.py','--check',str(p)], check=True)
              cfg = plistlib.load(p.open('rb'))
              matches = [x for x in cfg['Kernel']['Patch'] if x.get('Comment') == 'GMA 3150 Cursor corruption fix']
              assert len(matches) == 1
              assert cfg['DeviceProperties']['Add']['PciRoot(0x0)/Pci(0x2,0x0)']['device-id'] == bytes.fromhex('A2270000')
              assert cfg['NVRAM']['Add']['7C436110-AB2A-4BBB-A880-FE41995C9F82']['boot-args'].split().count('arch=i386') == 1
          print('ASUS config postprocessor: PASS')
          PY